name: Nightly Build

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-build
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  Check:
    if: github.repository == 'diffscope/diffscope-project' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check nightly eligibility
        id: check
        uses: diffscope/catalogs/actions/nightly@main
        with:
          operation: check

  Build:
    needs: Check
    if: needs.Check.outputs.should_build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ github.sha }}
      build_type: nightly
      use_cache: false
      use_ccache: false

  Publish:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      catalog_manifest: ${{ steps.publish.outputs.catalog_manifest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Publish nightly prerelease
        id: publish
        uses: diffscope/catalogs/actions/nightly@main
        with:
          operation: publish
          tag: ${{ needs.Build.outputs.tag }}
          application-name: ${{ needs.Build.outputs.application_name }}

  UpdateCatalogs:
    needs: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Update catalogs and wait for completion
        uses: diffscope/catalogs/actions/update-catalog@main
        with:
          product: diffscope
          channel: nightly
          manifest: ${{ needs.Publish.outputs.catalog_manifest }}
          app-id: ${{ vars.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
