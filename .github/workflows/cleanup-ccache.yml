name: Clean CCache

on:
  workflow_run:
    workflows: [Dev Build, Nightly Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-ccache
  cancel-in-progress: false

jobs:
  Clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clean CCache snapshots
        uses: diffscope/catalogs/actions/prune-ccache@main
