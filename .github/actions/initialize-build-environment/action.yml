name: Initialize building environment
description: Initialize building environment

inputs:
  qt_version:
    description: Qt version to install
    required: true
  use_cache:
    description: Restore and save build environment caches
    required: false
    default: 'true'

runs:
  using: "composite"

  steps:
    - name: Setup devcmd
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ccache protoc

    - name: Install build tools (Ubuntu)
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        sudo apt update
        sudo apt-get -y install `
          build-essential ninja-build ccache file binutils patchelf p7zip-full pkg-config tar xz-utils zip unzip curl git `
          autoconf autoconf-archive automake libtool libltdl-dev bison flex m4 perl python3 python3-venv `
          libasound2-dev libatopology-dev `
          libxrandr-dev libxinerama-dev libxrender-dev libxcomposite-dev libxcursor-dev `
          libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libzstd-dev `
          protobuf-compiler desktop-file-utils

    - name: Install AppImage tools (Linux)
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        $toolDirectory = Join-Path $env:RUNNER_TEMP 'appimage-tools'
        New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
        $appImageTool = Join-Path $toolDirectory 'appimagetool.AppImage'
        $runtime = Join-Path $toolDirectory 'runtime-x86_64'
        Invoke-WebRequest -Uri 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage' -OutFile $appImageTool
        Invoke-WebRequest -Uri 'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64' -OutFile $runtime
        & /bin/chmod +x -- $appImageTool
        if ($LASTEXITCODE -ne 0) {
          throw 'Failed to make appimagetool executable'
        }
        "APPIMAGETOOL_PATH=$appImageTool" >> $env:GITHUB_ENV
        "APPIMAGE_RUNTIME_PATH=$runtime" >> $env:GITHUB_ENV

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: pwsh
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew update
        brew install ninja ccache imagemagick create-dmg protobuf

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt_version }}
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head' # FIXME remove this after the next release of aqt
        modules: qt5compat qtscxml qtshadertools qtgrpc qttasktree
        cache: ${{ inputs.use_cache == 'true' }}
