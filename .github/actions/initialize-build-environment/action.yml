name: Initialize building environment
description: Initialize building environment

inputs:
  qt_version:
    description: Qt version to install
    required: true
  use_cache:
    description: Restore and save build environment caches
    required: false
    default: 'true'
  use_ccache:
    description: Install ccache
    required: false
    default: 'true'

runs:
  using: "composite"

  steps:
    - name: Setup devcmd
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ccache protoc

    - name: Install build tools (Ubuntu)
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        sudo apt update
        sudo apt-get -y install `
          build-essential ninja-build file binutils patchelf p7zip-full pkg-config squashfs-tools tar xz-utils zip unzip curl git `
          autoconf autoconf-archive automake libtool libltdl-dev bison flex m4 perl python3 python3-venv `
          libasound2-dev libatopology-dev `
          libxrandr-dev libxinerama-dev libxrender-dev libxcomposite-dev libxcursor-dev `
          libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libzstd-dev `
          protobuf-compiler desktop-file-utils

    # TODO remove this after Ubuntu Packages' ccache updated to 4.14.2
    - name: Install CCache (Linux)
      if: runner.os == 'Linux' && inputs.use_ccache == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RUNNER_ARCH -ne 'X64') {
          throw 'Unsupported ccache architecture'
        }
        $version = '4.14.2'
        $archiveName = "ccache-$version-linux-x86_64-musl-static.tar.gz"
        $directory = Join-Path $env:RUNNER_TEMP ("ccache-" + [guid]::NewGuid())
        New-Item -ItemType Directory -Path $directory | Out-Null
        $archive = Join-Path $directory $archiveName
        Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$version/$archiveName" -OutFile $archive
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'd540ba01f160addbd3dd5e18eda9bd34005591b095c09ac8ae9d0a1b655e7ef5') {
          throw 'The ccache archive checksum does not match the release checksum'
        }
        & tar -xzf $archive -C $directory
        if ($LASTEXITCODE -ne 0) {
          throw 'The ccache archive could not be extracted'
        }
        $executables = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter ccache)
        if ($executables.Count -ne 1) {
          throw 'The ccache archive does not contain exactly one ccache executable'
        }
        $executables[0].DirectoryName >> $env:GITHUB_PATH

    - name: Install AppImage tools (Linux)
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        $toolDirectory = Join-Path $env:RUNNER_TEMP 'appimage-tools'
        New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
        $appImageTool = Join-Path $toolDirectory 'appimagetool.AppImage'
        $runtime = Join-Path $toolDirectory 'runtime-x86_64'
        Invoke-WebRequest -Uri 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage' -OutFile $appImageTool
        Invoke-WebRequest -Uri 'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64' -OutFile $runtime
        & /bin/chmod +x -- $appImageTool
        if ($LASTEXITCODE -ne 0) {
          throw 'Failed to make appimagetool executable'
        }
        Push-Location $toolDirectory
        try {
          & $appImageTool --appimage-extract | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to extract appimagetool'
          }
          $extractedToolDirectory = Join-Path $toolDirectory 'squashfs-root'
          $bundledMksquashfs = Join-Path $extractedToolDirectory 'usr/bin/mksquashfs'
          if (-not (Test-Path -LiteralPath $bundledMksquashfs -PathType Leaf)) {
            throw 'The extracted appimagetool does not contain mksquashfs'
          }
          Remove-Item -LiteralPath $bundledMksquashfs -Force
          & /bin/ln -s -- /usr/bin/mksquashfs $bundledMksquashfs
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to link the system mksquashfs into appimagetool'
          }
          "APPIMAGETOOL_PATH=$(Join-Path $extractedToolDirectory 'AppRun')" >> $env:GITHUB_ENV
        } finally {
          Pop-Location
        }
        "APPIMAGE_RUNTIME_PATH=$runtime" >> $env:GITHUB_ENV

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: pwsh
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew update
        brew install ninja ccache imagemagick create-dmg protobuf

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt_version }}
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head' # FIXME remove this after the next release of aqt
        modules: qt5compat qtscxml qtshadertools qtgrpc qttasktree
        cache: ${{ inputs.use_cache == 'true' }}
