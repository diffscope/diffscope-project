name: Initialize Vcpkg
description: Prepare the vcpkg workspace in deps/ with scripts/vcpkg-workspace.cmake

inputs:
  use_cache:
    description: Restore and save vcpkg binary caches
    required: false
    default: 'true'


runs:
  using: "composite"
  steps:
    - name: Prepare vcpkg
      if: inputs.use_cache == 'true'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ${{ github.workspace }}/../vcpkg_archives -Force
        Write-Output VCPKG_DEFAULT_BINARY_CACHE=$(Resolve-Path ${{ github.workspace }}/../vcpkg_archives) >> $env:GITHUB_ENV

    # The binary cache of vcpkg is keyed by the ABI of each package, so a cache of other sources
    # is also of use.
    - name: Restore vcpkg binary cache
      id: cache_vcpkg
      if: inputs.use_cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('scripts/vcpkg-sources.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ hashFiles('scripts/vcpkg-sources.json') }}-
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg dependencies
      env:
        USE_CACHE: ${{ inputs.use_cache }}
        VCPKG_KEEP_ENV_VARS: "VCPKG_BUILD_TYPE;MACOSX_DEPLOYMENT_TARGET"
        DEV_SCRIPTS_REF: ${{ env.DEV_SCRIPTS_REF || 'main' }}
      shell: pwsh
      run: |
        if ($env:USE_CACHE -eq 'true' -and !(Test-Path $env:VCPKG_DEFAULT_BINARY_CACHE)) {
          New-Item $env:VCPKG_DEFAULT_BINARY_CACHE -ItemType directory
        }
        Set-Location ${{ github.workspace }}
        # vcpkg-workspace.cmake is not part of the repository, see scripts/.gitignore
        Invoke-WebRequest -OutFile scripts/vcpkg-workspace.cmake `
          "https://raw.githubusercontent.com/stdware/dev-scripts/$env:DEV_SCRIPTS_REF/scripts/vcpkg-workspace.cmake"
        $arguments = @('-P', 'scripts/vcpkg-workspace.cmake', 'install', '--qt-dir', $env:QT_ROOT_DIR)
        if ($env:USE_CACHE -ne 'true') {
          $env:VCPKG_BINARY_SOURCES = 'clear'
          'VCPKG_BINARY_SOURCES=clear' >> $env:GITHUB_ENV
          $arguments += @('--', '--binarysource=clear')
        }
        cmake @arguments
        if ($LASTEXITCODE -ne 0) {
          throw 'vcpkg installation failed'
        }
        Write-Output VCPKG_ROOT_DIR=$(Resolve-Path deps/vcpkg) >> $env:GITHUB_ENV

    - name: Save vcpkg binary cache
      if: inputs.use_cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('scripts/vcpkg-sources.json') }}-${{ github.sha }}
